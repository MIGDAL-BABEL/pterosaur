name: Pterosaur CI

# 路径过滤在 job 级用 dorny/paths-filter 做（不用 `head_commit.modified`：
# 它只在 push 事件存在、且只看最后一次提交，对 pull_request 完全无效）。
# 注意：**契约变更触发三端全跑**（ADR-066）——如果某次协议变更忘了同步契约，
# 全部端的一致性测试会因向量不符而失败，这正是我们要的效果。

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================ 变更检测 ============================
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      contract: ${{ steps.filter.outputs.contract }}
      macos: ${{ steps.filter.outputs.macos }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'apps/server/**'
              - 'packages/shared/**'
              - 'packages/core/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'tsconfig*.json'
              - '.github/workflows/**'
            contract:
              - 'packages/contract/**'
              - 'packages/core/**'
              - 'packages/shared/**'
            macos:
              - 'apps/macos/**'
            android:
              - 'apps/android/**'

  # ============================ Web / server / shared / contract ============================
  web:
    needs: [changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      # vp 会根据pnpm-workspace.yaml的allowBuilds等字段预处理 workspace 配置，
      # 再调用 pnpm install。先用 vp 自己的安装链接环（vp install），再 vp 管 fmt/lint/test。
      # vp 的安装脚本在 GitHub Actions 里不把 binary 放进 PATH（实测 line 2: vp: command not found）。
      # 改用 npm 全局包，binary 落在 setup-node 提供的全局 bin 目录，PATH 天然可见。
      - name: Install vp
        run: npm install -g vite-plus
      - run: vp --version
      - name: Install dependencies
        run: |
          set -o pipefail
          vp install 2>&1 | tee /tmp/vp-install.log
          # vp 自带 pnpm fallback（本地即 ~/.local/vite-plus/data/fallback-bin/pnpm）
          find "$HOME/.local/vite-plus" -name pnpm -type f 2>/dev/null | head -1 | xargs -r dirname >> "$GITHUB_PATH"
          which pnpm || vp pnpm --version || true
      - if: failure()
        run: tail -40 /tmp/vp-install.log 2>/dev/null | while IFS= read -r l; do echo "::error::$l"; done
      - run: vp check
      - run: vp test run
      - name: Build server
        run: pnpm --filter @pterosaur/server build
      - name: Build web
        run: pnpm --filter @pterosaur/web build

  # ============================ 契约：生成器确定 + 参考实现自检 ============================
  contract:
    needs: [changes, web]
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Install vp
        run: npm install -g vite-plus
      - name: Install dependencies
        run: |
          vp install
          find "$HOME/.local/vite-plus" -name pnpm -type f 2>/dev/null | head -1 | xargs -r dirname >> "$GITHUB_PATH"
      # 生成器必须确定：重跑后工作区没有 diff
      - run: pnpm --filter @pterosaur/contract regen:capabilities
      - run: pnpm --filter @pterosaur/contract regen:vectors
      - run: pnpm --filter @pterosaur/contract regen:golden
      - run: git diff --exit-code -- packages/contract
      - run: pnpm --filter @pterosaur/contract test

  # ============================ macOS / Swift ============================
  macos:
    needs: [changes]
    # 契约或 shared/core 变化也跑（协议变了，各端必须重新对齐）
    if: needs.changes.outputs.macos == 'true' || needs.changes.outputs.contract == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/macos
    env:
      PTEROSAUR_CONTRACT: ${{ github.workspace }}/packages/contract
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/swift-test.log
      - if: failure()
        run: |
          echo "::error::swift test 失败，最后 60 行："
          tail -60 /tmp/swift-test.log | while IFS= read -r l; do echo "::error::$l"; done

  # ============================ Android / Kotlin ============================
  android:
    needs: [changes]
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      # 骨架阶段仓库里没有 gradle wrapper（不塞二进制 jar）；feat/android 提交时再补
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: gradle :core:test